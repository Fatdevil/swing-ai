<div class="absolute inset-0 z-10 p-6 flex flex-col justify-between pointer-events-none">

<div class="flex justify-between items-start">
<div class="bg-black/40 backdrop-blur-md rounded-lg p-3 border border-white/10 flex flex-col gap-1">
<div class="flex items-center gap-2">

<span class="text-[10px] font-bold uppercase tracking-widest text-primary-fixed font-headline">AI TRACKING ACTIVE</span>
</div>
<div class="text-[10px] text-on-surface-variant font-mono">LATENCY: 14ms</div>
</div>
<div class="bg-black/40 backdrop-blur-md rounded-lg p-3 border border-white/10 text-right">
<div class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">FPS</div>
<div class="text-2xl font-headline font-bold text-primary-fixed leading-none">240</div>
</div>
</div>
<!-- Central Viewport: Skeleton & Stance Guide -->
<div class="relative flex-grow flex items-center justify-center">

<div class="absolute top-4 left-4 camera-corner border-t-2 border-l-2 opacity-50"></div>
<div class="absolute top-4 right-4 camera-corner border-t-2 border-r-2 opacity-50"></div>
<div class="absolute bottom-4 left-4 camera-corner border-b-2 border-l-2 opacity-50"></div>
<div class="absolute bottom-4 right-4 camera-corner border-b-2 border-r-2 opacity-50"></div>

<svg class="w-64 h-auto opacity-70 drop-shadow-[0_0_15px_rgba(157,255,0,0.4)]" viewbox="0 0 200 400">
<!-- Head -->
<circle cx="100" cy="50" fill="none" r="15" stroke="#9dff00" stroke-width="2"></circle>
<!-- Spine -->
<line stroke="#9dff00" stroke-dasharray="4 2" stroke-width="2" x1="100" x2="100" y1="65" y2="180"></line>
<!-- Shoulders -->
<line stroke="#9dff00" stroke-width="3" x1="60" x2="140" y1="80" y2="80"></line>
<!-- Arms -->
<polyline fill="none" points="60,80 40,150 70,220" stroke="#9dff00" stroke-width="2"></polyline>
<polyline fill="none" points="140,80 160,150 130,220" stroke="#9dff00" stroke-width="2"></polyline>
<!-- Hips -->
<line stroke="#9dff00" stroke-width="3" x1="75" x2="125" y1="180" y2="180"></line>
<!-- Legs -->
<polyline fill="none" points="75,180 70,280 80,380" stroke="#9dff00" stroke-width="2"></polyline>
<polyline fill="none" points="125,180 130,280 120,380" stroke="#9dff00" stroke-width="2"></polyline>

<circle cx="100" cy="80" fill="#9dff00" r="3"></circle>
<circle cx="60" cy="80" fill="#9dff00" r="3"></circle>
<circle cx="140" cy="80" fill="#9dff00" r="3"></circle>
<circle cx="70" cy="220" fill="#9dff00" r="3"></circle>
<circle cx="130" cy="220" fill="#9dff00" r="3"></circle>
</svg>
<!-- Alignment Markers -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-full h-[1px] bg-primary-fixed/20"></div>
<div class="h-full w-[1px] bg-primary-fixed/20"></div>
</div>
</div>

<div class="grid grid-cols-3 gap-4 pb-20">
<div class="bg-surface-container/60 backdrop-blur-md p-3 rounded-lg border border-white/5 flex flex-col items-center">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider">Angle</span>

</div>
<div class="bg-surface-container/60 backdrop-blur-md p-3 rounded-lg border border-white/5 flex flex-col items-center">

<span class="text-sm font-headline font-bold text-primary-fixed">OK</span>
</div>
<div class="bg-surface-container/60 backdrop-blur-md p-3 rounded-lg border border-white/5 flex flex-col items-center">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider">Light</span>
<span class="text-sm font-headline font-bold text-primary-fixed">OPTIMAL</span>
</div>
</div>
</div>

<div class="absolute inset-0 bg-primary-fixed/20 rounded-full blur-xl group-active:scale-150 transition-transform"></div>

</div>

<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">videocam</span>
</div>
</button>
</div>
